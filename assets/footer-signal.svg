<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Build for the real world</title>
  <desc id="desc">A terminal-inspired footer with a moving signal and the principles less repetition, clearer state, and safer data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset=".5" stop-color="#2dd4bf"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .blink { animation: blink 1.1s steps(2,end) infinite; }
      .bar1 { animation: wave 1.2s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center bottom; }
      .bar2 { animation: wave 1.65s .2s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center bottom; }
      .bar3 { animation: wave .95s .35s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center bottom; }
      @keyframes blink { 0%,48%{opacity:1} 49%,100%{opacity:0} }
      @keyframes wave { from{transform:scaleY(.2)} to{transform:scaleY(1)} }
      @media (prefers-reduced-motion: reduce) { .blink,.bar1,.bar2,.bar3 { animation:none } }
    </style>
  </defs>
  <rect width="1200" height="230" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="228" rx="23" fill="none" stroke="#355274"/>
  <rect x="28" y="26" width="1144" height="2" fill="url(#accent)" opacity=".8"/>

  <g class="mono">
    <text x="64" y="77" fill="#58a6ff" font-size="14">$ ship --to real-world --verify</text>
    <rect x="374" y="62" width="9" height="20" rx="1" fill="#58a6ff" class="blink"/>
    <text x="64" y="129" fill="#f3f7fc" font-size="28" font-weight="700" letter-spacing="1">LESS REPETITION · CLEARER STATE · SAFER DATA</text>
    <text x="65" y="164" fill="#7891ae" font-size="13" letter-spacing="1.8">CODE RETURNS TO THE REAL WORLD.</text>
  </g>

  <g transform="translate(940 73)" fill="#2dd4bf">
    <rect width="7" height="55" rx="3.5" class="bar1"/>
    <rect x="15" width="7" height="82" rx="3.5" class="bar2"/>
    <rect x="30" width="7" height="38" rx="3.5" class="bar3"/>
    <rect x="45" width="7" height="68" rx="3.5" class="bar2"/>
    <rect x="60" width="7" height="28" rx="3.5" class="bar1"/>
    <rect x="75" width="7" height="77" rx="3.5" class="bar3"/>
    <rect x="90" width="7" height="47" rx="3.5" class="bar2"/>
    <rect x="105" width="7" height="62" rx="3.5" class="bar1"/>
    <rect x="120" width="7" height="34" rx="3.5" class="bar3"/>
  </g>

  <circle cx="1102" cy="186" r="5" fill="#3fb950" filter="url(#glow)">
    <animate attributeName="opacity" values=".35;1;.35" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="1118" y="190" fill="#8fe3ae" font-size="10" class="mono" letter-spacing="1">READY</text>
</svg>
