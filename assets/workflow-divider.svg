<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-labelledby="title desc">
  <title id="title">Workflow divider</title>
  <desc id="desc">An animated pipeline from capture to verification, organization, and automation.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="0.82" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .node { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
      .n2 { animation-delay:.8s }.n3 { animation-delay:1.6s }.n4 { animation-delay:2.4s }
      @keyframes pulse { 0%,100%{opacity:.48;transform:scale(.86)} 25%{opacity:1;transform:scale(1.14)} }
      @media (prefers-reduced-motion: reduce) { .node { animation:none } }
    </style>
  </defs>
  <rect width="1200" height="96" fill="none"/>
  <path d="M64 48H1136" stroke="url(#line)" stroke-width="2"/>
  <path d="M64 54H1136" stroke="url(#line)" stroke-width="1" stroke-opacity=".18"/>

  <g class="mono" font-size="11" text-anchor="middle" letter-spacing="1.5">
    <g transform="translate(230 48)">
      <circle r="16" fill="#07111f" stroke="#58a6ff"/>
      <circle r="5" fill="#58a6ff" filter="url(#glow)" class="node"/>
      <text y="38" fill="#7493b5">CAPTURE</text>
    </g>
    <g transform="translate(475 48)">
      <circle r="16" fill="#07111f" stroke="#2dd4bf"/>
      <circle r="5" fill="#2dd4bf" filter="url(#glow)" class="node n2"/>
      <text y="38" fill="#7493b5">VERIFY</text>
    </g>
    <g transform="translate(725 48)">
      <circle r="16" fill="#07111f" stroke="#a3e635"/>
      <circle r="5" fill="#a3e635" filter="url(#glow)" class="node n3"/>
      <text y="38" fill="#7493b5">ORGANIZE</text>
    </g>
    <g transform="translate(970 48)">
      <circle r="16" fill="#07111f" stroke="#f59e0b"/>
      <circle r="5" fill="#f59e0b" filter="url(#glow)" class="node n4"/>
      <text y="38" fill="#7493b5">AUTOMATE</text>
    </g>
  </g>

  <circle r="4" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="5.6s" repeatCount="indefinite" path="M64 48H1136"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="5.6s" repeatCount="indefinite"/>
  </circle>
</svg>
